<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日摄入追踪</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="摄入追踪">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center;padding:16px}
.container{max-width:640px;width:100%}
.header{text-align:center;margin-bottom:18px}
.header h1{font-size:22px;font-weight:700;color:#fff}
.header .date{font-size:13px;color:#888;margin-top:2px}
.card{background:#1a1a1a;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #2a2a2a}
.card h2{font-size:15px;color:#ccc;margin-bottom:10px}
.goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.goal-edit-btn{background:none;border:1px solid #444;color:#aaa;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.goal-edit-btn:hover{color:#4ade80;border-color:#4ade80}
.goal-bars{display:flex;flex-direction:column;gap:8px}
.goal-row{display:flex;align-items:center;gap:10px}
.goal-label{width:48px;font-size:12px;color:#aaa;text-align:right;flex-shrink:0}
.goal-bar-wrap{flex:1;height:18px;background:#252525;border-radius:9px;overflow:hidden;position:relative}
.goal-bar{height:100%;border-radius:9px;transition:width .4s;position:absolute;left:0;top:0}
.goal-bar.c{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.goal-bar.p{background:linear-gradient(90deg,#ef4444,#f87171)}
.goal-bar.f{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.goal-bar.k{background:linear-gradient(90deg,#10b981,#34d399)}
.goal-val{width:88px;font-size:11px;color:#ccc;text-align:left;flex-shrink:0}
.goal-val span{color:#fff;font-weight:600}
.goal-edit-form{display:none;flex-wrap:wrap;gap:8px;margin-top:10px}
.goal-edit-form.show{display:flex}
.goal-edit-form input{width:72px;padding:5px 6px;background:#252525;border:1px solid #333;border-radius:6px;color:#fff;font-size:13px;text-align:center}
.goal-edit-form label{font-size:11px;color:#888}
.goal-edit-form button{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.goal-save{background:#4ade80;color:#000}
.goal-cancel{background:#333;color:#ccc}
.add-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.add-row select{flex:2;min-width:130px;padding:9px 8px;background:#252525;border:1px solid #333;border-radius:8px;color:#fff;font-size:13px;outline:none}
.add-row select:focus{border-color:#4ade80}
.add-row select option,.add-row select optgroup{background:#1a1a1a}
.add-row input[type=number]{width:60px;padding:9px 4px;background:#252525;border:1px solid #333;border-radius:8px;color:#fff;font-size:13px;text-align:center;outline:none}
.raw-cooked-toggle{display:flex;background:#252525;border-radius:8px;overflow:hidden;border:1px solid #333;flex-shrink:0}
.raw-cooked-toggle button{padding:7px 10px;border:none;background:none;color:#777;font-size:12px;cursor:pointer;font-weight:600}
.raw-cooked-toggle button.active{background:#4ade80;color:#000}
.raw-cooked-toggle.hidden{display:none}
.add-btn{padding:9px 16px;background:#4ade80;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.search-wrap{margin-bottom:8px}
.search-wrap input{width:100%;padding:8px 10px;background:#252525;border:1px solid #333;border-radius:8px;color:#fff;font-size:13px;outline:none}
.search-wrap input:focus{border-color:#4ade80}
.suggestions{position:absolute;top:100%;left:0;right:0;background:#1a1a1a;border:1px solid #333;border-radius:0 0 10px 10px;max-height:280px;overflow-y:auto;z-index:40;display:none}
.suggestions.show{display:block}
.suggestion-item{padding:10px 14px;cursor:pointer;font-size:13px;color:#ccc;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2a2a}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover,.suggestion-item.active{background:#252525;color:#fff}
.suggestion-item .s-name{flex:1}
.suggestion-item .s-macros{font-size:11px;color:#666}
.search-wrap{position:relative}
.food-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow-y:auto}
.food-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#252525;border-radius:8px;font-size:13px}
.food-item .fi-name{flex:1;color:#ddd;font-size:13px}
.food-item .fi-weight{color:#4ade80;font-size:11px;min-width:40px}
.food-item .fi-macros{font-size:11px;color:#666;white-space:nowrap}
.food-item .fi-del{background:none;border:none;color:#555;cursor:pointer;font-size:16px;padding:0 2px}
.food-item .fi-del:hover{color:#ef4444}
.empty-state{text-align:center;color:#444;padding:24px;font-size:13px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-item{background:#252525;border-radius:10px;padding:12px;text-align:center}
.summary-item .s-val{font-size:26px;font-weight:800;color:#fff}
.summary-item .s-label{font-size:11px;color:#888}
.summary-item .s-pct{font-size:10px;margin-top:1px}
.s-pct.good{color:#4ade80}.s-pct.warn{color:#f59e0b}.s-pct.over{color:#ef4444}
.reset-row{display:flex;justify-content:center;margin-top:12px}
.reset-btn{background:none;border:1px solid #333;color:#555;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px}
.reset-btn:hover{border-color:#ef4444;color:#ef4444}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:20px;width:90%;max-width:400px}
.modal-box h3{font-size:16px;margin-bottom:12px;color:#fff}
.modal-box .field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.modal-box .field label{width:60px;font-size:12px;color:#888;text-align:right}
.modal-box .field input{flex:1;padding:6px 8px;background:#252525;border:1px solid #333;border-radius:6px;color:#fff;font-size:13px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-btns button{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-cancel{background:#333;color:#ccc}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#4ade80;color:#000;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.add-custom-row{text-align:center;margin-top:8px}
.add-custom-btn{background:none;border:1px dashed #444;color:#666;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px}
.add-custom-btn:hover{border-color:#4ade80;color:#4ade80}
@media(max-width:480px){.summary-grid{grid-template-columns:1fr 1fr}.food-item .fi-macros{font-size:10px}.add-row select{min-width:100px;font-size:12px}}

.splash{position:fixed;inset:0;z-index:9999;background:#0f0f0f url(./splash.png) center/cover no-repeat;display:flex};flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash-icon{width:100px;height:100px;border-radius:24px;background:rgba(26,26,26,0.7);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative}
.splash-ring{width:64px;height:64px;border-radius:50%;border:5px solid #333;border-top-color:#4ade80;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.splash-sub{font-size:13px;color:#666}

.unit-select{background:#252525;border:1px solid #333;border-radius:8px;color:#fff;font-size:12px;padding:8px 6px;outline:none;min-width:90px;flex-shrink:0}
.unit-select:focus{border-color:#4ade80}
.unit-select option{background:#1a1a1a}
.unit-select.hidden{display:none}
</style>
</head>
<body>
<div class="splash" id="splash">
<div class="splash-icon"><div class="splash-ring"></div></div>
<div class="splash-title">每日摄入追踪</div>
<div class="splash-sub">掌控每一餐</div>
</div>

<div class="container">
<div class="header"><h1>每日摄入追踪</h1><div class="date" id="dateDisplay"></div></div>
<div class="card">
<div class="goal-header"><h2>今日目标</h2><button class="goal-edit-btn" onclick="toggleGoalEdit()">修改</button></div>
<div class="goal-bars" id="goalBars"></div>
<div class="goal-edit-form" id="goalEditForm">
<div><label>碳水g</label><input id="goalCarbs" type="number" value="250"></div>
<div><label>蛋白质g</label><input id="goalProtein" type="number" value="150"></div>
<div><label>脂肪g</label><input id="goalFat" type="number" value="60"></div>
<div><label>热量kcal</label><input id="goalCalories" type="number" value="2200"></div>
<button class="goal-save" onclick="saveGoals()">保存</button>
<button class="goal-cancel" onclick="toggleGoalEdit()">取消</button>
</div>
</div>
<div class="card">
<h2>添加食物</h2>
<div class="search-wrap"><input id="foodSearch" type="search" placeholder="搜索食材..." oninput="onSearchInput()" onfocus="onSearchInput()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="food-search-input"><div class="suggestions" id="suggestions"></div></div>
<div class="add-row">
<select id="foodSelect" onchange="onFoodChange()"><option value="">-- 选择食物 --</option></select>
<div class="raw-cooked-toggle hidden" id="rawCookedToggle">
<button id="btnRaw" class="active" onclick="setWeightMode('raw')">生重</button>
<button id="btnCooked" onclick="setWeightMode('cooked')">熟重</button>
</div>
<input id="foodAmount" type="number" placeholder="克" value="100" min="1" autocomplete="off" inputmode="numeric"><select class="unit-select hidden" id="unitSelect" onchange="onUnitChange()"><option value="g">按克数</option></select>
<button class="add-btn" onclick="addFood()">+</button>
</div>
<div class="food-list" id="foodList"></div>
<div class="empty-state" id="emptyState">还没有记录，开始添加食物吧</div>
<div class="add-custom-row"><button class="add-custom-btn" onclick="showCustomModal()">+ 自定义食材</button> <button class="add-custom-btn" onclick="showManageModal()">管理自定义</button></div>
</div>
<div class="card">
<h2>今日汇总</h2>
<div class="summary-grid" id="summaryGrid"></div>
</div>
<div class="card">
<h2>历史记录 <span style="font-weight:400;color:#666;font-size:12px;" id="historyCount"></span></h2>
<div id="historyList" style="display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto;">
<div class="empty-state">暂无历史记录</div>
</div>
</div>
<div class="reset-row"><button class="reset-btn" onclick="resetToday()">清空今日记录</button></div>
</div>
<div class="modal-overlay" id="customModal">
<div class="modal-box">
<h3>自定义食材</h3>
<div class="field"><label>名称</label><input id="custName" placeholder="如：蛋白粉" autocomplete="off" autocorrect="off"></div>
<div class="field"><label>碳水 g</label><input id="custCarbs" type="number" value="0" step="0.1"></div>
<div class="field"><label>蛋白质 g</label><input id="custProtein" type="number" value="0" step="0.1"></div>
<div class="field"><label>脂肪 g</label><input id="custFat" type="number" value="0" step="0.1"></div>
<div class="field"><label>分类</label><input id="custCat" value="自定义"></div>
<div class="modal-btns">
<button class="btn-cancel" onclick="hideCustomModal()">取消</button>
<button class="add-btn" onclick="addCustomFood()">添加</button>
</div>
</div>
</div>
<div class="modal-overlay" id="manageModal">
<div class="modal-box">
<h3>管理自定义食材</h3>
<div id="manageList" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
<div class="modal-btns"><button class="btn-cancel" onclick="hideManageModal()">关闭</button></div>
</div>
</div>
<div class="toast" id="toast"></div>

var CUSTOM_KEY="cfv2",STORAGE_KEY="div2",GOAL_KEY="dgv2";
function loadCustom(){try{return JSON.parse(localStorage.getItem(CUSTOM_KEY)||"[]")}catch(e){return[]}}
function saveCustom(f){localStorage.setItem(CUSTOM_KEY,JSON.stringify(f))}
function allFoods(){return FOOD_DB.concat(loadCustom())}
function getToday(){var d=new Date(),m=d.getMonth()+1,dt=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dt<10?"0":"")+dt}
function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){return{}}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function loadGoals(){var g=null;try{g=JSON.parse(localStorage.getItem(GOAL_KEY))}catch(e){}return g||{carbs:250,protein:150,fat:60,calories:2200}}
function saveGoalsStore(g){localStorage.setItem(GOAL_KEY,JSON.stringify(g))}
function getTodayItems(){var items=loadData()[getToday()]||[];for(var i=0;i<items.length;i++){var it=items[i];if(!it.rc)it.rc="raw";if(!it.wm)it.wm="raw"}return items}
function setTodayItems(items){var d=loadData();d[getToday()]=items;saveData(d)}
function calcCal(c,p,f){return Math.round(c*4+p*4+f*9)}
var PROTEIN_CATS=["肉类","蛋奶","豆类","补剂"];
function isAnimalProtein(foodName){var all=allFoods();for(var i=0;i<all.length;i++){if(all[i].name===foodName){return PROTEIN_CATS.indexOf(all[i].cat)>-1}}return false}
function calcTotals(items){var c=0,p=0,ap=0,f=0;for(var i=0;i<items.length;i++){var it=items[i];var r=it.amount/100;c+=it.carbs*r;var pp=it.protein*r;p+=pp;if(isAnimalProtein(it.name))ap+=pp;f+=it.fat*r}return{carbs:Math.round(c*10)/10,protein:Math.round(ap*10)/10,proteinTotal:Math.round(p*10)/10,fat:Math.round(f*10)/10,calories:calcCal(c,p,f)}}

var curFood=null;
var weightMode="raw";

function onFoodChange(){
  var v=document.getElementById("foodSelect").value;
  var all=allFoods();
  curFood=null;
  for(var i=0;i<all.length;i++){if(all[i].name===v){curFood=all[i];break}}
  updateToggle();
  updateUnitSelect();
}

function updateUnitSelect(){
  var sel=document.getElementById("unitSelect");
  if(!curFood||!curFood.units||curFood.units.length===0){
    sel.classList.add("hidden");
    sel.innerHTML='<option value="g">按克数</option>';
    document.getElementById("foodAmount").placeholder="克";
    document.getElementById("foodAmount").value="100";
    return;
  }
  sel.classList.remove("hidden");
  var h='<option value="g">按克数</option>';
  for(var i=0;i<curFood.units.length;i++){
    var u=curFood.units[i];
    h+='<option value="'+i+'">'+u.name+' ('+u.grams+'g)</option>';
  }
  sel.innerHTML=h;
}

function onUnitChange(){
  var sel=document.getElementById("unitSelect");
  var amt=document.getElementById("foodAmount");
  if(sel.value==="g"){
    amt.placeholder="克";
    amt.value="100";
    return;
  }
  var idx=parseInt(sel.value);
  if(curFood&&curFood.units&&curFood.units[idx]){
    amt.value=curFood.units[idx].grams;
    amt.placeholder="克 (自动填写)";
  }
}

function setWeightMode(m){
  weightMode=m;
  var br=document.getElementById("btnRaw");
  var bc=document.getElementById("btnCooked");
  if(m==="raw"){br.className="active";bc.className=""}
  else{br.className="";bc.className="active"}
}

function updateToggle(){
  var t=document.getElementById("rawCookedToggle");
  var br=document.getElementById("btnRaw");
  if(!curFood){t.classList.add("hidden");return}
  if(curFood.rc==="raw"&&curFood.cooked){
    t.classList.remove("hidden");
    br.style.display="";
    setWeightMode("raw");
  }else if(curFood.rc==="cooked"){
    t.classList.remove("hidden");
    br.style.display="none";
    weightMode="cooked";
    setWeightMode("cooked");
  }else{
    t.classList.add("hidden");
    weightMode="raw";
  }
}

function getEff(food,mode){
  if(mode==="cooked"&&food.cooked)return food.cooked;
  return food;
}

function renderDate(){
  var d=new Date();
  var w=["日","一","二","三","四","五","六"];
  document.getElementById("dateDisplay").textContent=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 星期"+w[d.getDay()];
}

function renderGoals(){
  var goals=loadGoals();
  var totals=calcTotals(getTodayItems());
  var protLabel=totals.protein!==totals.proteinTotal?totals.protein+" ("+totals.proteinTotal+")":"";
  var bars=[
    {label:"碳水",cls:"c",val:totals.carbs,goal:goals.carbs,unit:"g"},
    {label:"蛋白质",cls:"p",val:totals.protein,goal:goals.protein,unit:"g",extra:protLabel},
    {label:"脂肪",cls:"f",val:totals.fat,goal:goals.fat,unit:"g"},
    {label:"热量",cls:"k",val:totals.calories,goal:goals.calories,unit:"kcal"}
  ];
  var h="";
  for(var i=0;i<bars.length;i++){
    var b=bars[i];
    var pct=Math.min(b.val/b.goal*100,100);
    h+='<div class="goal-row"><div class="goal-label">'+b.label+'</div><div class="goal-bar-wrap"><div class="goal-bar '+b.cls+'" style="width:'+pct+'%"></div></div><div class="goal-val"><span>'+b.val+'</span>'+(b.extra?' <small style=color:#666>'+b.extra+'</small>':'')+' / '+b.goal+' '+b.unit+'</div></div>';
  }
  document.getElementById("goalBars").innerHTML=h;
}

function fuzzyMatch(text,query){
  var t=text.toLowerCase(),q=query.toLowerCase(),qi=0;
  for(var i=0;i<t.length&&qi<q.length;i++){if(t[i]===q[qi])qi++}
  return qi===q.length;
}
function onSearchInput(){
  var q=document.getElementById("foodSearch").value.trim();
  var sug=document.getElementById("suggestions");
  if(!q){sug.classList.remove("show");renderFoodSelect();return}
  var matches=[],foods=allFoods();
  for(var i=0;i<foods.length;i++){
    var f=foods[i];
    if(fuzzyMatch(f.name,q)||f.cat.toLowerCase().indexOf(q.toLowerCase())>-1)matches.push({f:f,score:fuzzyScore(f.name,q)});
  }
  matches.sort(function(a,b){return a.score-b.score});
  matches=matches.slice(0,10);
  if(matches.length===0){sug.classList.remove("show");renderFoodSelect();return}
  var h="";
  for(var j=0;j<matches.length;j++){
    var f=matches[j].f,rc=f.rc==="raw"?"生":f.rc==="cooked"?"熟":"";
    var nameEscaped=f.name.replace(/'/g,"\'");
    h+='<div class="suggestion-item" onclick="selectSuggestion(\''+nameEscaped+'\')">';
    h+='<span class="s-name">'+f.name+'</span>';
    h+='<span class="s-macros">碳'+f.carbs+' 蛋'+f.protein+' 脂'+f.fat+' | '+f.cat+'</span>';
    h+='</div>';
  }
  sug.innerHTML=h;sug.classList.add("show");renderFoodSelect();
}
function fuzzyScore(text,query){
  var t=text.toLowerCase(),q=query.toLowerCase(),qi=0,score=0;
  for(var i=0;i<t.length&&qi<q.length;i++){if(t[i]===q[qi]){score+=i;qi++}}
  return qi===q.length?score:9999;
}
function selectSuggestion(name){
  document.getElementById("foodSearch").value="";
  document.getElementById("foodSelect").value=name;
  document.getElementById("suggestions").classList.remove("show");
  onFoodChange();showToast("已选择: "+name);
}
document.addEventListener("click",function(e){
  var sug=document.getElementById("suggestions"),inp=document.getElementById("foodSearch");
  if(e.target!==inp&&!sug.contains(e.target))sug.classList.remove("show");
});
function renderFoodSelect(){
  var sel=document.getElementById("foodSelect");
  var s=(document.getElementById("foodSearch").value||"").toLowerCase();
  var foods=allFoods();
  var cats=[];
  for(var i=0;i<foods.length;i++){
    if(cats.indexOf(foods[i].cat)===-1)cats.push(foods[i].cat);
  }
  var h='<option value="">-- 选择食物 --</option>';
  for(var i=0;i<cats.length;i++){
    var cat=cats[i];
    var cfs=[];
    for(var j=0;j<foods.length;j++){
      if(foods[j].cat===cat){
        var nm=foods[j].name.toLowerCase();
        if(nm.indexOf(s)>-1||cat.toLowerCase().indexOf(s)>-1)cfs.push(foods[j]);
      }
    }
    if(cfs.length===0)continue;
    h+='<optgroup label="'+cat+'">';
    for(var k=0;k<cfs.length;k++){
      var f=cfs[k];
      var label=f.name;
      if(f.rc==="raw"||f.rc==="cooked")label+="";
      h+='<option value="'+f.name+'">'+label+'</option>';
    }
    h+='</optgroup>';
  }
  sel.innerHTML=h;
  curFood=null;
  updateToggle();
}

function renderFoodList(){
  var items=getTodayItems();
  var list=document.getElementById("foodList");
  var empty=document.getElementById("emptyState");
  if(items.length===0){list.innerHTML="";empty.style.display="block";return}
  empty.style.display="none";
  var h="";
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var r=it.amount/100;
    var c=Math.round(it.carbs*r*10)/10;
    var p=Math.round(it.protein*r*10)/10;
    var f=Math.round(it.fat*r*10)/10;
    var cal=Math.round(c*4+p*4+f*9);
    var wl=it.unitLabel||"";
    if(!wl){if(it.wm==="cooked")wl="熟";else if(it.rc==="raw")wl="生"}
    h+='<div class="food-item"><div class="fi-name">'+it.name+'</div><div class="fi-weight">'+(it.unitLabel||(it.amount+'g'))+'</div><div class="fi-macros">碳'+c+' 蛋'+p+' 脂'+f+' K'+cal+'</div><button class="fi-del" onclick="removeFood('+i+')">x</button></div>';
  }
  list.innerHTML=h;
}

function renderSummary(){
  var goals=loadGoals();
  var totals=calcTotals(getTodayItems());
  var pLabel="蛋白质";
  if(totals.protein!==totals.proteinTotal)pLabel="动物蛋白";
  var items=[
    {label:"碳水",val:totals.carbs,unit:"g",goal:goals.carbs},
    {label:pLabel,val:totals.protein,unit:"g",goal:goals.protein},
    {label:"脂肪",val:totals.fat,unit:"g",goal:goals.fat},
    {label:"热量",val:totals.calories,unit:"kcal",goal:goals.calories}
  ];
  var h="";
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var pct=it.goal?Math.round(it.val/it.goal*100):0;
    var cls="good";
    if(pct>=90&&pct<=110)cls="good";
    else if(pct>110)cls="over";
    else if(pct>=80)cls="warn";
    h+='<div class="summary-item"><div class="s-val">'+it.val+'</div><div class="s-label">'+it.label+' ('+it.unit+')</div><div class="s-pct '+cls+'">'+pct+'%</div></div>';
  }
  document.getElementById("summaryGrid").innerHTML=h;
}

function renderAll(){
  renderDate();
  renderGoals();
  renderFoodSelect();
  renderFoodList();
  renderSummary();
  renderHistory();
}

function addFood(){
  var name=document.getElementById("foodSelect").value;
  var amount=parseFloat(document.getElementById("foodAmount").value);
  if(!name){showToast("请选择食物");return}
  if(!amount||amount<=0){showToast("请输入克数");return}
  var food=null;
  var all=allFoods();
  for(var i=0;i<all.length;i++){if(all[i].name===name){food=all[i];break}}
  if(!food)return;
  var eff=getEff(food,weightMode);
  var items=getTodayItems();
  items.push({name:food.name,amount:amount,carbs:eff.carbs,protein:eff.protein,fat:eff.fat,rc:food.rc,wm:weightMode});
  setTodayItems(items);
  document.getElementById("foodSelect").value="";
  document.getElementById("foodAmount").value="100";
  curFood=null;
  updateToggle();
  renderAll();
setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("hide");setTimeout(function(){s.style.display="none"},500)}},200);
  showToast("已添加 "+food.name+" "+amount+"g");
}

function removeFood(idx){
  var items=getTodayItems();
  var rm=items[idx];
  items.splice(idx,1);
  setTodayItems(items);
  renderAll();
setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("hide");setTimeout(function(){s.style.display="none"},500)}},200);
  showToast("已移除 "+rm.name);
}

function resetToday(){
  if(!confirm("确定清空今天所有记录？"))return;
  setTodayItems([]);
  renderAll();
setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("hide");setTimeout(function(){s.style.display="none"},500)}},200);
  showToast("已清空");
}

function toggleGoalEdit(){
  var form=document.getElementById("goalEditForm");
  if(form.classList.contains("show")){form.classList.remove("show");return}
  var g=loadGoals();
  document.getElementById("goalCarbs").value=g.carbs;
  document.getElementById("goalProtein").value=g.protein;
  document.getElementById("goalFat").value=g.fat;
  document.getElementById("goalCalories").value=g.calories;
  form.classList.add("show");
}

function saveGoals(){
  var g={
    carbs:parseFloat(document.getElementById("goalCarbs").value)||250,
    protein:parseFloat(document.getElementById("goalProtein").value)||150,
    fat:parseFloat(document.getElementById("goalFat").value)||60,
    calories:parseFloat(document.getElementById("goalCalories").value)||2200
  };
  saveGoalsStore(g);
  document.getElementById("goalEditForm").classList.remove("show");
  renderAll();
setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("hide");setTimeout(function(){s.style.display="none"},500)}},200);
  showToast("目标已更新");
}

function showCustomModal(){document.getElementById("customModal").classList.add("show")}
function hideCustomModal(){document.getElementById("customModal").classList.remove("show")}

function addCustomFood(){
  var name=document.getElementById("custName").value.trim();
  var c=parseFloat(document.getElementById("custCarbs").value)||0;
  var p=parseFloat(document.getElementById("custProtein").value)||0;
  var f=parseFloat(document.getElementById("custFat").value)||0;
  var cat=document.getElementById("custCat").value.trim()||"自定义";
  if(!name){showToast("请输入名称");return}
  var cf=loadCustom();
  cf.push({name:name,carbs:c,protein:p,fat:f,cat:cat});
  saveCustom(cf);
  hideCustomModal();
  document.getElementById("custName").value="";
  renderFoodSelect();
  showToast("已添加: "+name);
}

var toastTimer;
function showToast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove("show")},1800);
}


// ===== 历史记录 =====
function renderHistory() {
  var allData = loadData();
  var today = getToday();
  var dates = Object.keys(allData).filter(function(d) { return d !== today; }).sort().reverse();
  document.getElementById("historyCount").textContent = dates.length ? "(" + dates.length + " 天)" : "";
  var container = document.getElementById("historyList");
  if (dates.length === 0) {
    container.innerHTML = '<div class="empty-state">暂无历史记录</div>';
    return;
  }
  var h = "";
  for (var i = 0; i < dates.length; i++) {
    var date = dates[i];
    var items = allData[date] || [];
    if (items.length === 0) continue;
    var totals = calcTotals(items);
    var d = new Date(date + "T00:00:00");
    var w = ["日","一","二","三","四","五","六"];
    var label = (d.getMonth()+1) + "月" + d.getDate() + "日 周" + w[d.getDay()];
    var goals = loadGoals();
    h += '<div style="background:#252525;border-radius:10px;overflow:hidden;margin-bottom:2px;">';
    h += '<div onclick="toggleHistory(\'' + date + '\')" style="padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;">';
    h += '<div style="flex:1;font-size:13px;color:#ddd;">' + label + '</div>';
    h += '<div style="font-size:12px;color:#888;">' + items.length + ' 项</div>';
    h += '<div style="font-size:12px;color:#4ade80;min-width:50px;text-align:right;">' + totals.calories + ' kcal</div>';
    h += '<div style="color:#555;font-size:14px;" id="arrow_' + date.replace(/-/g,"_") + '">▶</div>';
    h += '</div>';
    h += '<div id="hist_' + date.replace(/-/g,"_") + '" style="display:none;border-top:1px solid #333;padding:10px 14px;">';
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      var r = it.amount / 100;
      var c = Math.round(it.carbs * r * 10) / 10;
      var p = Math.round(it.protein * r * 10) / 10;
      var f = Math.round(it.fat * r * 10) / 10;
      var cal = Math.round(c*4 + p*4 + f*9);
      var wl = it.wm === "cooked" ? "熟" : (it.rc === "raw" ? "生" : "");
      h += '<div style="display:flex;padding:4px 0;font-size:12px;color:#aaa;">';
      h += '<span style="flex:1;">' + it.name + '</span>';
      h += '<span style="color:#4ade80;min-width:40px;">' + it.amount + 'g' + (wl||"") + '</span>';
      h += '<span style="color:#666;min-width:100px;text-align:right;">碳' + c + ' 蛋' + p + ' 脂' + f + ' | ' + cal + 'kcal</span>';
      h += '</div>';
    }
    h += '<div style="padding-top:6px;font-size:12px;color:#fff;text-align:right;border-top:1px solid #333;margin-top:4px;">';
    h += '合计: 碳水' + totals.carbs + 'g | 蛋白质' + totals.protein + 'g | 脂肪' + totals.fat + 'g | ' + totals.calories + 'kcal';
    h += '</div>';
    h += '</div>';
    h += '</div>';
  }
  container.innerHTML = h;
}

function toggleHistory(date) {
  var id = "hist_" + date.replace(/-/g, "_");
  var arrowId = "arrow_" + date.replace(/-/g, "_");
  var el = document.getElementById(id);
  var arrow = document.getElementById(arrowId);
  if (el.style.display === "none" || el.style.display === "") {
    el.style.display = "block";
    if (arrow) arrow.textContent = "▼";
  } else {
    el.style.display = "none";
    if (arrow) arrow.textContent = "▶";
  }
}

function showManageModal(){
  var cf=loadCustom(),h="";
  if(cf.length===0){h='<div class="empty-state" style=padding:20px>没有自定义食材</div>'}
  for(var i=0;i<cf.length;i++){
    var f=cf[i];
    h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#252525;border-radius:8px;font-size:13px">';
    h+='<span style="flex:1;color:#ddd">'+f.name+'</span>';
    h+='<span style="color:#666;font-size:11px">碳'+f.carbs+' 蛋'+f.protein+' 脂'+f.fat+' | '+f.cat+'</span>';
    h+='<button onclick="editCustom('+i+')" style="background:none;border:1px solid #444;color:#aaa;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px">编辑</button>';
    h+='<button onclick="deleteCustom('+i+')" style="background:none;border:1px solid #444;color:#ef4444;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px">删</button>';
    h+='</div>';
  }
  document.getElementById("manageList").innerHTML=h;
  document.getElementById("manageModal").classList.add("show");
}
function hideManageModal(){document.getElementById("manageModal").classList.remove("show")}
function deleteCustom(idx){
  var cf=loadCustom(),rm=cf[idx];cf.splice(idx,1);saveCustom(cf);
  showManageModal();renderFoodSelect();showToast("已删除: "+rm.name);
}
function editCustom(idx){
  var cf=loadCustom(),f=cf[idx];
  document.getElementById("custName").value=f.name;
  document.getElementById("custCarbs").value=f.carbs;
  document.getElementById("custProtein").value=f.protein;
  document.getElementById("custFat").value=f.fat;
  document.getElementById("custCat").value=f.cat||"自定义";
  cf.splice(idx,1);saveCustom(cf);
  hideManageModal();
  document.getElementById("customModal").classList.add("show");
  showToast("修改后点添加保存");
}
