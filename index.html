<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="摄入追踪" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日摄入追踪</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container { max-width: 600px; width: 100%; }

/* 头部 */
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 { font-size: 24px; font-weight: 700; color: #fff; }
.header .date {
  font-size: 14px; color: #888; margin-top: 4px;
}

/* 目标卡片 */
.goal-card {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid #2a2a2a;
}
.goal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.goal-header h2 { font-size: 16px; color: #ccc; }
.goal-edit-btn {
  background: none; border: 1px solid #444; color: #aaa;
  padding: 4px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
}
.goal-edit-btn:hover { border-color: #4ade80; color: #4ade80; }

.goal-bars { display: flex; flex-direction: column; gap: 10px; }
.goal-row {
  display: flex; align-items: center; gap: 12px;
}
.goal-label {
  width: 52px; font-size: 13px; color: #aaa; text-align: right; flex-shrink: 0;
}
.goal-bar-wrap {
  flex: 1; height: 20px; background: #252525;
  border-radius: 10px; overflow: hidden; position: relative;
}
.goal-bar {
  height: 100%; border-radius: 10px; transition: width 0.4s ease;
  position: absolute; left: 0; top: 0;
}
.goal-bar.carbs { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.goal-bar.protein { background: linear-gradient(90deg, #ef4444, #f87171); }
.goal-bar.fat { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
.goal-bar.calories { background: linear-gradient(90deg, #10b981, #34d399); }

.goal-val {
  width: 90px; font-size: 12px; color: #ccc; text-align: left; flex-shrink: 0;
}
.goal-val span { color: #fff; font-weight: 600; }

.goal-edit-form {
  display: none; flex-wrap: wrap; gap: 10px; margin-top: 12px;
}
.goal-edit-form.show { display: flex; }
.goal-edit-form input {
  width: 80px; padding: 6px 8px; background: #252525; border: 1px solid #333;
  border-radius: 8px; color: #fff; font-size: 13px; text-align: center;
}
.goal-edit-form label { font-size: 12px; color: #888; }
.goal-edit-form button {
  padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 600;
}
.goal-save { background: #4ade80; color: #000; }
.goal-cancel { background: #333; color: #ccc; }

/* 摄入面板 */
.intake-card {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid #2a2a2a;
}
.section-title {
  font-size: 16px; color: #ccc; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

/* 快速添加 */
.quick-add {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.quick-add select, .quick-add input {
  padding: 10px 12px; background: #252525; border: 1px solid #333;
  border-radius: 10px; color: #fff; font-size: 14px; outline: none;
}
.quick-add select { flex: 1; min-width: 140px; }
.quick-add input { width: 70px; text-align: center; }
.quick-add select:focus, .quick-add input:focus { border-color: #4ade80; }

.quick-add select option { background: #1a1a1a; }

.add-btn {
  padding: 10px 20px; background: #4ade80; color: #000;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.add-btn:hover { background: #22c55e; }

/* 已添加列表 */
.food-list { display: flex; flex-direction: column; gap: 6px; }
.food-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: #252525; border-radius: 10px;
}
.food-item .fi-name { flex: 1; font-size: 14px; color: #ddd; }
.food-item .fi-amount { font-size: 13px; color: #888; }
.food-item .fi-macros { font-size: 12px; color: #666; min-width: 120px; text-align: right; }
.food-item .fi-del {
  background: none; border: none; color: #555; cursor: pointer;
  font-size: 18px; padding: 0 4px; line-height: 1;
}
.food-item .fi-del:hover { color: #ef4444; }

.empty-state {
  text-align: center; color: #555; padding: 20px; font-size: 14px;
}

/* 汇总卡片 */
.summary-card {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid #2a2a2a;
}
.summary-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.summary-item {
  background: #252525; border-radius: 12px; padding: 14px; text-align: center;
}
.summary-item .s-val {
  font-size: 28px; font-weight: 800; color: #fff;
}
.summary-item .s-label {
  font-size: 12px; color: #888; margin-top: 4px;
}
.summary-item .s-pct {
  font-size: 11px; margin-top: 2px;
}

.s-pct.good { color: #4ade80; }
.s-pct.warn { color: #f59e0b; }
.s-pct.over { color: #ef4444; }

/* 重置按钮 */
.reset-row {
  display: flex; justify-content: center; margin-top: 16px;
}
.reset-btn {
  background: none; border: 1px solid #333; color: #555;
  padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 12px;
}
.reset-btn:hover { border-color: #ef4444; color: #ef4444; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #4ade80; color: #000; padding: 10px 24px;
  border-radius: 12px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; }

@media (max-width: 480px) {
  .summary-grid { grid-template-columns: 1fr 1fr; }
  .quick-add { flex-direction: column; }
  .quick-add input { width: 100%; }
  .food-item .fi-macros { display: none; }
}
</style>
</head>
<body>
<div class="container">

  <!-- 头部 -->
  <div class="header">
    <h1>📊 每日摄入追踪</h1>
    <div class="date" id="dateDisplay"></div>
  </div>

  <!-- 目标卡片 -->
  <div class="goal-card">
    <div class="goal-header">
      <h2>🎯 今日目标</h2>
      <button class="goal-edit-btn" onclick="toggleGoalEdit()">修改目标</button>
    </div>
    <div class="goal-bars" id="goalBars"></div>
    <div class="goal-edit-form" id="goalEditForm">
      <div><label>碳水 (g)</label><input id="goalCarbs" type="number" value="250"></div>
      <div><label>蛋白质 (g)</label><input id="goalProtein" type="number" value="150"></div>
      <div><label>脂肪 (g)</label><input id="goalFat" type="number" value="60"></div>
      <div><label>热量 (kcal)</label><input id="goalCalories" type="number" value="2200"></div>
      <button class="goal-save" onclick="saveGoals()">保存</button>
      <button class="goal-cancel" onclick="toggleGoalEdit()">取消</button>
    </div>
  </div>

  <!-- 添加食物 -->
  <div class="intake-card">
    <div class="section-title">🍽️ 添加食物</div>
    <div class="quick-add">
      <select id="foodSelect">
        <option value="">-- 选择食物 --</option>
      </select>
      <input id="foodAmount" type="number" placeholder="克数" value="100" min="1" step="1">
      <button class="add-btn" onclick="addFood()">+ 添加</button>
    </div>
    <div class="food-list" id="foodList"></div>
    <div class="empty-state" id="emptyState">还没有记录，开始添加今天的食物吧 🥗</div>
  </div>

  <!-- 汇总 -->
  <div class="summary-card">
    <div class="section-title">📋 今日汇总</div>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div class="reset-row">
    <button class="reset-btn" onclick="resetToday()">清空今日记录</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============= 食物数据库 (每100g) =============
const FOOD_DB = [
  // 谷物与主食
  { name: "大米（生重）", carbs: 77.2, protein: 7.4, fat: 0.8, cat: "主食" },
  { name: "馒头（熟重）", carbs: 47.0, protein: 7.0, fat: 1.1, cat: "主食" },
  { name: "面条（生挂面）", carbs: 70.0, protein: 11.0, fat: 1.3, cat: "主食" },
  { name: "燕麦片（生重）", carbs: 67.0, protein: 12.0, fat: 6.7, cat: "主食" },
  // 薯类
  { name: "土豆（马铃薯）", carbs: 17.2, protein: 2.0, fat: 0.2, cat: "薯类" },
  { name: "红薯（地瓜）", carbs: 24.7, protein: 1.1, fat: 0.2, cat: "薯类" },
  { name: "玉米（甜玉米，熟）", carbs: 22.8, protein: 3.5, fat: 1.2, cat: "薯类" },
  // 肉类
  { name: "猪五花肉", carbs: 1.2, protein: 9.5, fat: 37.0, cat: "肉类" },
  { name: "猪里脊肉", carbs: 1.5, protein: 20.2, fat: 7.9, cat: "肉类" },
  { name: "鸡胸肉", carbs: 0.5, protein: 24.6, fat: 1.9, cat: "肉类" },
  { name: "牛肉（牛腱肉）", carbs: 1.2, protein: 19.9, fat: 4.2, cat: "肉类" },
  { name: "海鱼", carbs: 0.1, protein: 17.5, fat: 4.0, cat: "肉类" },
  { name: "鲜虾", carbs: 0.5, protein: 18.6, fat: 0.8, cat: "肉类" },
  // 蔬菜
  { name: "西兰花（绿花菜）", carbs: 4.3, protein: 4.1, fat: 0.6, cat: "蔬菜" },
  { name: "菠菜", carbs: 3.6, protein: 2.6, fat: 0.3, cat: "蔬菜" },
  { name: "番茄（西红柿）", carbs: 3.3, protein: 0.9, fat: 0.2, cat: "蔬菜" },
  // 其他
  { name: "鸡蛋（全蛋）", carbs: 0.8, protein: 13.3, fat: 8.8, cat: "蛋奶" },
  { name: "牛奶（纯牛奶）", carbs: 3.4, protein: 3.0, fat: 3.6, cat: "蛋奶" },
  { name: "大豆（黄豆，生重）", carbs: 34.2, protein: 35.1, fat: 16.0, cat: "豆类" },
];

// ============= 状态管理 =============
const STORAGE_KEY = "daily_intake_data";
const GOAL_KEY = "daily_intake_goals";

function getToday() {
  return new Date().toISOString().slice(0, 10);
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return {};
  try { return JSON.parse(raw); } catch(e) { return {}; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadGoals() {
  const raw = localStorage.getItem(GOAL_KEY);
  if (!raw) return { carbs: 250, protein: 150, fat: 60, calories: 2200 };
  try { return JSON.parse(raw); } catch(e) { return { carbs: 250, protein: 150, fat: 60, calories: 2200 }; }
}

function saveGoalsToStore(goals) {
  localStorage.setItem(GOAL_KEY, JSON.stringify(goals));
}

function getTodayItems() {
  const data = loadData();
  return data[getToday()] || [];
}

function setTodayItems(items) {
  const data = loadData();
  data[getToday()] = items;
  saveData(data);
}

// ============= 计算 =============
function calcCalories(carbs, protein, fat) {
  return Math.round(carbs * 4 + protein * 4 + fat * 9);
}

function calcTotals(items) {
  let carbs = 0, protein = 0, fat = 0;
  for (const item of items) {
    const ratio = item.amount / 100;
    carbs += item.carbs * ratio;
    protein += item.protein * ratio;
    fat += item.fat * ratio;
  }
  return {
    carbs: Math.round(carbs * 10) / 10,
    protein: Math.round(protein * 10) / 10,
    fat: Math.round(fat * 10) / 10,
    calories: calcCalories(carbs, protein, fat)
  };
}

// ============= 渲染 =============
function renderAll() {
  renderDate();
  renderGoalBars();
  renderFoodSelect();
  renderFoodList();
  renderSummary();
}

function renderDate() {
  const d = new Date();
  const weekdays = ["日","一","二","三","四","五","六"];
  document.getElementById("dateDisplay").textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
}

function renderGoalBars() {
  const goals = loadGoals();
  const totals = calcTotals(getTodayItems());
  const bars = [
    { key: "carbs", label: "碳水", color: "carbs", val: totals.carbs, goal: goals.carbs, unit: "g" },
    { key: "protein", label: "蛋白质", color: "protein", val: totals.protein, goal: goals.protein, unit: "g" },
    { key: "fat", label: "脂肪", color: "fat", val: totals.fat, goal: goals.fat, unit: "g" },
    { key: "calories", label: "热量", color: "calories", val: totals.calories, goal: goals.calories, unit: "kcal" },
  ];

  document.getElementById("goalBars").innerHTML = bars.map(b => {
    const pct = Math.min(b.val / b.goal * 100, 100);
    const overClass = b.val > b.goal ? "over" : "";
    return `<div class="goal-row">
      <div class="goal-label">${b.label}</div>
      <div class="goal-bar-wrap">
        <div class="goal-bar ${b.color}" style="width:${pct}%"></div>
      </div>
      <div class="goal-val ${overClass}">
        <span>${b.val}</span> / ${b.goal} ${b.unit}
      </div>
    </div>`;
  }).join("");
}

function renderFoodSelect() {
  const sel = document.getElementById("foodSelect");
  // Group by category
  const cats = [...new Set(FOOD_DB.map(f => f.cat))];
  sel.innerHTML = '<option value="">-- 选择食物 --</option>';
  for (const cat of cats) {
    const group = document.createElement("optgroup");
    group.label = cat;
    for (const f of FOOD_DB.filter(x => x.cat === cat)) {
      const opt = document.createElement("option");
      opt.value = f.name;
      opt.textContent = f.name;
      group.appendChild(opt);
    }
    sel.appendChild(group);
  }
}

function renderFoodList() {
  const items = getTodayItems();
  const list = document.getElementById("foodList");
  const empty = document.getElementById("emptyState");

  if (items.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";
  list.innerHTML = items.map((item, idx) => {
    const ratio = item.amount / 100;
    const c = Math.round(item.carbs * ratio * 10) / 10;
    const p = Math.round(item.protein * ratio * 10) / 10;
    const f = Math.round(item.fat * ratio * 10) / 10;
    return `<div class="food-item">
      <div class="fi-name">${item.name}</div>
      <div class="fi-amount">${item.amount}g</div>
      <div class="fi-macros">碳${c}g 蛋${p}g 脂${f}g</div>
      <button class="fi-del" onclick="removeFood(${idx})" title="删除">✕</button>
    </div>`;
  }).join("");
}

function renderSummary() {
  const goals = loadGoals();
  const totals = calcTotals(getTodayItems());

  const items = [
    { label: "碳水化合物", val: totals.carbs, unit: "g", goal: goals.carbs },
    { label: "蛋白质", val: totals.protein, unit: "g", goal: goals.protein },
    { label: "脂肪", val: totals.fat, unit: "g", goal: goals.fat },
    { label: "热量", val: totals.calories, unit: "kcal", goal: goals.calories },
  ];

  document.getElementById("summaryGrid").innerHTML = items.map(item => {
    const pct = item.goal ? Math.round(item.val / item.goal * 100) : 0;
    let pctClass = "good";
    if (pct >= 90 && pct <= 110) pctClass = "good";
    else if (pct > 110) pctClass = "over";
    else if (pct >= 80) pctClass = "warn";
    else pctClass = "";

    return `<div class="summary-item">
      <div class="s-val">${item.val}</div>
      <div class="s-label">${item.label} (${item.unit})</div>
      <div class="s-pct ${pctClass}">${pct}%</div>
    </div>`;
  }).join("");
}

// ============= 操作 =============
function addFood() {
  const sel = document.getElementById("foodSelect");
  const amtInput = document.getElementById("foodAmount");
  const foodName = sel.value;
  const amount = parseFloat(amtInput.value);

  if (!foodName) { showToast("请选择一种食物"); return; }
  if (!amount || amount <= 0) { showToast("请输入有效的克数"); return; }

  const food = FOOD_DB.find(f => f.name === foodName);
  if (!food) return;

  const items = getTodayItems();
  items.push({
    name: food.name,
    amount: amount,
    carbs: food.carbs,
    protein: food.protein,
    fat: food.fat,
  });
  setTodayItems(items);

  // Reset selection
  sel.value = "";
  amtInput.value = "100";

  renderAll();
  showToast(`已添加 ${food.name} ${amount}g`);
}

function removeFood(idx) {
  const items = getTodayItems();
  const removed = items[idx];
  items.splice(idx, 1);
  setTodayItems(items);
  renderAll();
  showToast(`已移除 ${removed.name}`);
}

function resetToday() {
  if (!confirm("确定清空今天所有记录吗？此操作无法撤销。")) return;
  setTodayItems([]);
  renderAll();
  showToast("今日记录已清空");
}

// ============= 目标编辑 =============
function toggleGoalEdit() {
  const form = document.getElementById("goalEditForm");
  const goals = loadGoals();
  if (form.classList.contains("show")) {
    form.classList.remove("show");
  } else {
    document.getElementById("goalCarbs").value = goals.carbs;
    document.getElementById("goalProtein").value = goals.protein;
    document.getElementById("goalFat").value = goals.fat;
    document.getElementById("goalCalories").value = goals.calories;
    form.classList.add("show");
  }
}

function saveGoals() {
  const goals = {
    carbs: parseFloat(document.getElementById("goalCarbs").value) || 250,
    protein: parseFloat(document.getElementById("goalProtein").value) || 150,
    fat: parseFloat(document.getElementById("goalFat").value) || 60,
    calories: parseFloat(document.getElementById("goalCalories").value) || 2200,
  };
  saveGoalsToStore(goals);
  document.getElementById("goalEditForm").classList.remove("show");
  renderAll();
  showToast("目标已更新");
}

// ============= Toast =============
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

// ============= Service Worker =============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

// ============= 初始化 =============
renderAll();
</script>
</body>
</html>
